spec:
  version: "1.1.0"
  file:
    path: packages/server/src/core/MemoryBuilder
    language: typescript
  imports:
    - from: "node:crypto"
      symbols:
        - randomUUID
    - from: "drizzle-orm"
      symbols:
        - and
        - eq
        - gt
        - isNull
        - or
        - inArray
        - lt
        - lte
    - from: "../config/database"
      symbols:
        - getDb
    - from: "../db/schema"
      symbols:
        - agents
        - channels
        - modelModules
        - instructionModules
        - toolkitModules
        - tools
        - runtimeOverrides
        - messages
        - taskFiles
        - compressedSummaries
    - from: "../types/agent.types"
      symbols:
        - AgentProfile
        - AuthorityLevel
    - from: "../types/message.types"
      symbols:
        - ChannelMessage
    - from: "./PromptFormatter"
      symbols:
        - formatMessageForAgent
    - from: "../memory/memoryRetrieval"
      symbols:
        - retrieveMemoryCandidates
        - buildMemoryPreviewBlock
  types:
    - name: BuildPromptInput
      kind: struct
      fields:
        - name: agentId
          type: string
          required: true
        - name: channelId
          type: string
          required: true
        - name: currentMessage
          type: string
          required: false
        - name: spawnRequestId
          type: string
          required: false
        - name: summarizer
          type: "(messages: any[], previousSummary?: string) => Promise<string>"
          required: false
        - name: tokenCounter
          type: "(text: string) => number"
          required: false
    - name: PromptAssemblyResult
      kind: struct
      fields:
        - name: systemPrompt
          type: string
          required: true
        - name: userPrompt
          type: string
          required: true
        - name: modelParameters
          type: "{     temperature: number;     topP: number;     maxOutputTokens: number;     stopSequences: string[];   }"
          required: true
        - name: estimatedTokens
          type: "{     systemPromptTokens: number;     userPromptTokens: number;     totalTokens: number;   }"
          required: true
  exports:
    - name: MemoryBuilder.buildPrompt
      kind: function
      async: true
      params:
        - name: input
          type: BuildPromptInput
      returns: "Promise<PromptAssemblyResult>"
      doc: "Main pipeline to build the unified system and user prompts for an agent in a channel."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.agents.findFirst"
        - action: call
          value: "eq"
        - action: if
          condition: "!agent"
        - action: throw
          value: "new Error(`Agent not found with id: ${input.agentId}`)"
        - action: call
          value: "db.query.modelModules.findFirst"
        - action: call
          value: "eq"
        - action: if
          condition: "!modelModule"
        - action: throw
          value: "new Error(`ModelModule not found with id: ${agent.modelModuleId}`)"
        - action: call
          value: "db.query.instructionModules.findFirst"
    - name: MemoryBuilder.isPairPrivateChannel
      kind: function
      async: true
      params:
        - name: channelId
          type: string
      returns: "Promise<boolean>"
      doc: "Determine if a channel is a pair_private (L3 worker-supervisor) channel."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.channels.findFirst"
        - action: call
          value: "eq"
        - action: return
          value: "channel?.type === \"pair_private\""
    - name: MemoryBuilder.compileAuthorityContext
      kind: function
      async: true
      params:
        - name: agent
          type: "typeof agents.$inferSelect"
        - name: channelId
          type: string
      returns: "Promise<string>"
      doc: "Compiles the Authority Context block depending on the agent tier."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.channels.findFirst"
        - action: call
          value: "eq"
        - action: if
          condition: "agent.authorityLevel === 1"
        - action: call
          value: "db.query.agents.findMany"
        - action: call
          value: "eq"
        - action: call
          value: "l2Agents         .map((a, idx) => `${idx + 1}. Name: \"${a.name}\" (Title: ${a.title})`)         .join"
        - action: call
          value: "l2Agents         .map"
        - action: return
          value: "`<authority_context> Kamu adalah Level 1 CEO Agent. Kamu memiliki akses ke Bipolar Dispatch Function. Berikut daftar agen L2 yang tersedia: ${l2List || \"Tidak ada L2 Manager yang terdaftar.\"} </authority_context>`"
        - action: if
          condition: "agent.authorityLevel === 2"
    - name: MemoryBuilder.buildSharedMemory
      kind: function
      async: true
      params:
        - name: agent
          type: "typeof agents.$inferSelect"
        - name: channelId
          type: string
        - name: modelModule
          type: "typeof modelModules.$inferSelect"
        - name: customSummarizer
          type: "(messages: any[], previousSummary?: string) => Promise<string>"
        - name: currentMessage
          type: string
      returns: "Promise<string>"
      doc: "Fetches, filters, compresses, and compiles Shared Memory message tags."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.messages.findMany"
        - action: call
          value: "and"
        - action: call
          value: "eq"
        - action: call
          value: "eq"
        - action: call
          value: "asc"
        - action: if
          condition: "allMessages.length === 0"
        - action: return
          value: "\"\""
        - action: if
          condition: "currentMessage && allMessages.length > 0"
        - action: if
          condition: "lastMsg.authorType === \"user\" && lastMsg.content === currentMessage"
    - name: MemoryBuilder.getChannelName
      kind: function
      async: true
      params:
        - name: channelId
          type: string
      returns: "Promise<string>"
      doc: "Helper to look up channel name."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.channels.findFirst"
        - action: call
          value: "eq"
        - action: return
          value: "ch?.name ?? \"unknown\""
    - name: MemoryBuilder.evaluateVisibility
      kind: function
      async: false
      params:
        - name: msg
          type: "typeof messages.$inferSelect"
        - name: agent
          type: "typeof agents.$inferSelect"
      returns: boolean
      doc: "Evaluates the Visibility Matrix rules for a single message."
      intent:
        - action: call
          value: "msg.mentions?.some"
        - action: call
          value: "m.targetName.toLowerCase"
        - action: call
          value: "agent.name.toLowerCase"
        - action: call
          value: "m.targetName.toLowerCase"
        - action: call
          value: "agent.name.toLowerCase"
        - action: if
          condition: "isMentioned"
        - action: return
          value: "true"
        - action: if
          condition: "agent.memorySharingPolicy === \"none\""
        - action: return
          value: "false"
        - action: if
          condition: "agent.memorySharingPolicy === \"full\""
    - name: MemoryBuilder.getOrUpdateSummary
      kind: function
      async: true
      params:
        - name: channelId
          type: string
        - name: upToSeq
          type: number
        - name: messagesToCompress
          type: "typeof messages.$inferSelect[]"
        - name: customSummarizer
          type: "(messages: any[], previousSummary?: string) => Promise<string>"
      returns: "Promise<string>"
      doc: "Summary compression engine with database caching."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.compressedSummaries.findFirst"
        - action: call
          value: "eq"
        - action: call
          value: "desc"
        - action: if
          condition: "cached"
        - action: if
          condition: "cached.coversUpToSeq >= upToSeq"
        - action: return
          value: "cached.summary"
        - action: call
          value: "messagesToCompress.filter"
        - action: if
          condition: "newMessages.length === 0"
        - action: return
          value: "cached.summary"
    - name: MemoryBuilder.defaultNaiveSummary
      kind: function
      async: false
      params:
        - name: messagesToCompress
          type: "any[]"
        - name: prevSummary
          type: any
      returns: string
      doc: "Dynamic fallback summarization helper."
      intent:
        - action: call
          value: "messagesToCompress       .map((m) => m.authorName)       .filter((v, i, a) => a.indexOf(v) === i)       .join"
        - action: call
          value: "messagesToCompress       .map((m) => m.authorName)       .filter"
        - action: call
          value: "messagesToCompress       .map"
        - action: call
          value: "a.indexOf"
        - action: if
          condition: "prevSummary"
        - action: return
          value: "summary"
    - name: MemoryBuilder.buildIndependentMemory
      kind: function
      async: true
      params:
        - name: agentId
          type: string
        - name: channelId
          type: string
      returns: "Promise<string>"
      doc: "Compiles Independent Memory (Self-Scratchpad / Monologue)."
      intent:
        - action: call
          value: "getDb"
        - action: call
          value: "db.query.messages.findMany"
        - action: call
          value: "and"
        - action: call
          value: "eq"
        - action: call
          value: "eq"
        - action: call
          value: "eq"
        - action: call
          value: "asc"
        - action: if
          condition: "thoughts.length === 0"
        - action: return
          value: "\"\""
        - action: call
          value: "thoughts       .map(         (t) =>           `<internal_thought timestamp=\"${t.timestamp.toISOString()}\">\\n${t.content}\\n</internal_thought>`       )       .join"
  constraints:
    style:
      indent: 2
      quotes: double
      semicolons: true
