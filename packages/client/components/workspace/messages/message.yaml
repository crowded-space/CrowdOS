spec:
  version: "1.1.0"
  file:
    path: packages/client/components/workspace/messages/message
    language: typescript
  imports:
    - from: "react"
      symbols:
        - React
    - from: "@/types/crowd-os"
      symbols:
        - Message
        - AgentLevel
    - from: "./human-message"
      symbols:
        - HumanMessage
    - from: "./agent-message"
      symbols:
        - AgentMessage
    - from: "./system-message"
      symbols:
        - SystemMessage
    - from: "./delegation-message"
      symbols:
        - DelegationMessage
    - from: "./tool-execution-message"
      symbols:
        - ToolExecutionMessage
    - from: "lucide-react"
      symbols:
        - ShieldAlert
        - CheckCircle2
        - XCircle
        - Loader2
  types:
    - name: MessageRouterProps
      kind: struct
      fields:
        - name: message
          type: Message
          required: true
        - name: agentLevel
          type: AgentLevel
          required: false
        - name: key
          type: string
          required: false
  exports:
    - name: MessageRouter
      kind: function
      async: false
      params:
        - name: { message, agentLevel = 3 }
          type: MessageRouterProps
      returns: void
      doc: "Exported function MessageRouter."
      intent:
        - action: return
          value: "(         <HumanMessage            authorName={message.authorName}            content={message.content}            timestamp={message.timestamp}            attachments={message.attachments}           mentions={message.mentions}         />       )"
        - action: return
          value: "(         <AgentMessage            id={message.id}           authorId={message.authorId}           authorName={message.authorName}           authorAvatar={message.authorAvatar}           content={message.content}           timestamp={message.timestamp}           metadata={message.metadata}           level={agentLevel}           attachments={message.attachments}         />       )"
        - action: return
          value: "(         <SystemMessage            content={message.content}            timestamp={message.timestamp}          />       )"
        - action: return
          value: "(         <DelegationMessage            delegationInfo={message.delegationInfo}            timestamp={message.timestamp}          />       )"
        - action: return
          value: "(         <ToolExecutionMessage            toolExecution={message.toolExecution}            timestamp={message.timestamp}          />       )"
        - action: if
          condition: "subtype === 'strike'"
        - action: return
          value: "(           <div              id=\"strike-warning\"             className=\"max-w-xl mx-auto border border-amber-500/25 bg-amber-500/[0.02] p-3.5 rounded-lg my-3 font-mono text-xs text-amber-300 animate-pulse shadow-md\"           >             <div className=\"flex items-center gap-2 mb-1.5 text-amber-450 font-bold tracking-wide select-none\">               <ShieldAlert size={14} className=\"shrink-0 text-amber-450 animate-bounce\" />               <span>SWARM SAFETY STRIKE INITIATED</span>             </div>                          <div className=\"flex items-center gap-2 my-2 select-none\">               <div className=\"flex gap-1\">                 {Array.from({ length: max }).map((_, i) => (                   <span                      key={i}                      className={`w-4 h-2.5 rounded-xs border ${                       i < count                          ? 'bg-amber-500 border-amber-600 shadow-[0_0_4px_#f59e0b]'                          : 'bg-zinc-950 border-zinc-800'                     }`}                    />                 ))}               </div>               <span className=\"text-[10px] text-zinc-550 font-bold ml-1\">STRIKE {count} OF {max} RECORDED</span>             </div>              <p className=\"leading-relaxed text-zinc-300 font-sans pl-0 mt-1 select-text\">               <strong>Agent Exception:</strong> {message.content}             </p>             <div className=\"text-right text-[8.5px] text-zinc-650 mt-2 select-none\">               AUDITED AT {new Date(message.timestamp).toLocaleTimeString()}             </div>           </div>         )"
        - action: call
          value: "Array.from({ length: max }).map"
        - action: call
          value: "Array.from"
        - action: call
          value: "new Date(message.timestamp).toLocaleTimeString"
  constraints:
    style:
      indent: 2
      quotes: double
      semicolons: true
