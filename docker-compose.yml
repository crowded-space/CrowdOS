services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in BullMQ delivery (Murder-scale fan-out only). Default stack runs
  # inline: `docker compose up` = api + postgres. Queue mode:
  # `docker compose --profile queue up` (sets QUEUE_MODE=bullmq on api+worker).
  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowdos-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_agent
      QUEUE_MODE: ${QUEUE_MODE:-inline}
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      # CREDENTIALS_ENCRYPTION_KEY must be set in production (32-byte hex). Generate: openssl rand -hex 32
      # CREDENTIALS_ENCRYPTION_KEY: "change-me-32-byte-hex"
    ports:
      - "3001:3001"
    command: npm run dev --workspace @crowdspace/server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowdos-worker
    profiles: ["queue"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_agent
      REDIS_URL: redis://redis:6379
      QUEUE_MODE: bullmq
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
    command: npm run worker --workspace @crowdspace/server
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
