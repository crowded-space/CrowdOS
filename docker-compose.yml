services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowdos-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_agent
      REDIS_URL: redis://redis:6379
      QUEUE_MODE: bullmq
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      AUTH_STRICT: "false"
    ports:
      - "3001:3001"
    command: npm run dev --workspace @community-agent/server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowdos-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_agent
      REDIS_URL: redis://redis:6379
      QUEUE_MODE: bullmq
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      AUTH_STRICT: "false"
    command: npm run worker --workspace @community-agent/server
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
