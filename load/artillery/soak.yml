# SCL-1: Artillery — 8h soak (nightly)
# Run nightly: BASE_URL=http://localhost:3001 SOAK_DURATION=28800 npx artillery run load/artillery/soak.yml
config:
  target: "{{ $env.BASE_URL || 'http://localhost:3001' }}"
  phases:
    - duration: "{{ $env.SOAK_DURATION || 120 }}"
      arrivalRate: 20
      name: soak
  ensure:
    maxErrorRate: 1
    p95: 1000

scenarios:
  - name: soak mix
    weight: 100
    flow:
      - loop:
          - get:
              url: "/health"
          - get:
              url: "/api/search?q=soak&limit=10"
          - get:
              url: "/metrics"
          - get:
              url: "/api/queue/health"
        count: 50
      - think: 1
